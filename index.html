<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>午饭菜单</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fffaf2;
      --ink: #24221f;
      --muted: #6d6861;
      --line: #e7ded2;
      --green: #2f6f4e;
      --green-2: #dceadf;
      --red: #a23d32;
      --yellow: #f2c94c;
      --blue: #426c8f;
      --shadow: 0 18px 50px rgba(54, 43, 31, .12);
      --radius: 8px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(255,250,242,.94), rgba(255,250,242,.98)),
        url("https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=1800&q=80") center / cover fixed;
      color: var(--ink);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      max-width: 1220px;
      margin: 0 auto;
      padding: 28px 22px 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      box-shadow: var(--shadow);
      flex: 0 0 auto;
    }

    .brand svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 42px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-btn,
    .primary-btn,
    .ghost-btn {
      min-height: 42px;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
      white-space: nowrap;
    }

    .icon-btn {
      width: 42px;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .primary-btn {
      padding: 0 16px;
      background: var(--green);
      color: #fff;
      box-shadow: 0 10px 24px rgba(47,111,78,.22);
    }

    .ghost-btn {
      padding: 0 14px;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .icon-btn:hover,
    .primary-btn:hover,
    .ghost-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(54, 43, 31, .13);
    }

    .icon-btn svg,
    .primary-btn svg,
    .ghost-btn svg,
    .modal-close svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr);
      gap: 22px;
      align-items: stretch;
      margin-bottom: 22px;
    }

    .today-panel {
      min-height: 340px;
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
      border: 1px solid rgba(231, 222, 210, .8);
    }

    .today-panel img {
      width: 100%;
      height: 100%;
      min-height: 340px;
      object-fit: cover;
      display: block;
    }

    .today-copy {
      position: absolute;
      inset: auto 0 0;
      padding: 30px;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .68));
      color: #fff;
    }

    .today-copy h2 {
      margin: 0 0 8px;
      font-size: clamp(30px, 5vw, 60px);
      line-height: .98;
      letter-spacing: 0;
    }

    .today-copy p {
      max-width: 660px;
      margin: 0;
      color: rgba(255,255,255,.86);
      font-size: 16px;
      line-height: 1.75;
    }

    .pick-panel {
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      padding: 22px;
      display: flex;
      flex-direction: column;
      min-height: 340px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .panel-title h2,
    .menu-head h2 {
      margin: 0;
      font-size: 21px;
      letter-spacing: 0;
    }

    .date-chip {
      color: var(--red);
      background: #fae8e5;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 13px;
      white-space: nowrap;
    }

    .selected-list {
      display: grid;
      gap: 10px;
      flex: 1;
      align-content: start;
      min-height: 120px;
    }

    .selected-item,
    .empty-state {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px;
      background: #fffdf9;
    }

    .selected-item {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) 32px;
      gap: 10px;
      align-items: center;
    }

    .selected-item img {
      width: 54px;
      height: 54px;
      object-fit: cover;
      border-radius: 6px;
    }

    .selected-item strong {
      display: block;
      font-size: 15px;
    }

    .selected-item span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .remove-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #f7eee6;
      color: var(--red);
      font-size: 20px;
      line-height: 1;
    }

    .empty-state {
      color: var(--muted);
      line-height: 1.7;
    }

    .note-box {
      margin-top: 16px;
      border-top: 1px solid var(--line);
      padding-top: 15px;
    }

    .note-box label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .note-box input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 12px;
      color: var(--ink);
      background: #fffdf9;
      outline: none;
    }

    .pick-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .history-box {
      margin-top: 16px;
      border-top: 1px solid var(--line);
      padding-top: 15px;
    }

    .history-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .history-title h3 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
    }

    .history-list {
      display: grid;
      gap: 8px;
      max-height: 214px;
      overflow: auto;
      padding-right: 4px;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fffdf9;
      padding: 10px;
    }

    .history-item summary {
      cursor: pointer;
      font-weight: 700;
      list-style-position: inside;
    }

    .history-item ul {
      margin: 8px 0 0;
      padding-left: 20px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 13px;
    }

    .history-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 13px;
    }

    .search-wrap svg {
      width: 18px;
      height: 18px;
      color: var(--muted);
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
    }

    .search-wrap input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .chip {
      min-height: 38px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .chip.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    .menu-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 28px 0 14px;
    }

    .menu-head p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .category-stack {
      display: grid;
      gap: 22px;
    }

    .category-section {
      display: grid;
      gap: 12px;
    }

    .category-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .category-head h3 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .category-head p {
      margin: 4px 0 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .category-count {
      border-radius: 999px;
      background: #eef4ef;
      color: var(--green);
      padding: 6px 10px;
      font-size: 13px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .dish-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 10px 30px rgba(54,43,31,.08);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .dish-image {
      position: relative;
      aspect-ratio: 4 / 3;
      background: #eee2d6;
      overflow: hidden;
    }

    .dish-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .28s ease;
    }

    .dish-card:hover .dish-carousel img {
      transform: scale(1.04);
    }

    .dish-carousel {
      position: absolute;
      inset: 0;
    }

    .dish-carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .car-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .88);
      color: var(--ink);
      font-size: 15px;
      line-height: 1;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .car-nav.prev { left: 6px; }
    .car-nav.next { right: 6px; }

    .dish-card:hover .car-nav {
      display: flex;
    }

    .car-dots {
      position: absolute;
      left: 0;
      right: 0;
      top: 8px;
      display: none;
      justify-content: center;
      gap: 4px;
      z-index: 2;
    }

    .dish-card:hover .car-dots {
      display: flex;
    }

    .car-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .85);
      cursor: pointer;
    }

    .car-dot.on {
      background: var(--green);
    }

    .badge-row {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      border-radius: 999px;
      background: rgba(255,255,255,.9);
      color: var(--ink);
      padding: 5px 8px;
      font-size: 12px;
      backdrop-filter: blur(8px);
    }

    .dish-body {
      padding: 14px 14px 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .dish-title {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .dish-title h3 {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .heat {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      color: var(--red);
      font-size: 13px;
      white-space: nowrap;
    }

    .dish-body p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: var(--radius);
      background: #fae8e5;
      color: var(--red);
      font-weight: 600;
      text-decoration: none;
    }

    .modal-thumbs {
      position: absolute;
      bottom: 12px;
      left: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      max-width: calc(100% - 28px);
    }

    .modal-thumbs img {
      width: 62px;
      height: 46px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, .7);
      opacity: .85;
      transition: opacity .15s ease, border-color .15s ease;
    }

    .modal-thumbs img.active,
    .modal-thumbs img:hover {
      border-color: var(--green);
      opacity: 1;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .meta span {
      background: #f7f1e9;
      border-radius: 999px;
      padding: 5px 8px;
    }

    .card-actions {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .card-actions button {
      min-height: 38px;
      border-radius: 7px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .card-actions button.pick {
      background: var(--green-2);
      border-color: #bfd5c5;
      color: #214b35;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(24, 22, 20, .54);
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      width: min(880px, 100%);
      max-height: min(760px, 92vh);
      overflow: auto;
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: 0 30px 80px rgba(0,0,0,.34);
    }

    .modal-hero {
      position: relative;
      min-height: 280px;
    }

    .modal-hero img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      color: var(--ink);
      display: grid;
      place-items: center;
    }

    .modal-content {
      padding: 24px;
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 22px;
    }

    .modal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .88);
      color: var(--ink);
      font-size: 20px;
      display: grid;
      place-items: center;
      z-index: 2;
    }

    .modal-nav.prev { left: 12px; }
    .modal-nav.next { right: 12px; }

    .modal-content h2 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: 0;
    }

    .modal-content p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.75;
    }

    .recipe-block {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
    }

    .recipe-block h3 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .recipe-block ul,
    .recipe-block ol {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
      line-height: 1.75;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: var(--ink);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      transition: opacity .18s ease, transform .18s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 980px) {
      .topbar,
      .hero,
      .filters,
      .menu-head {
        grid-template-columns: 1fr;
      }

      .topbar,
      .menu-head {
        align-items: stretch;
      }

      .category-head {
        align-items: start;
        flex-direction: column;
      }

      .toolbar,
      .chips {
        justify-content: flex-start;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .modal-content {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .app {
        padding: 18px 14px 34px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .today-copy {
        padding: 22px;
      }

      .card-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 3v7a4 4 0 0 0 4 4V3"/><path d="M10 14v7"/><path d="M17 3v18"/><path d="M17 3c2.2 1.2 3.5 3.2 3.5 5.8S19.2 13.4 17 15"/></svg>
        </div>
        <div>
          <h1>午饭菜单</h1>
          <p class="subtitle">给每天中午的选择困难，留一个好看又好用的答案。</p>
        </div>
      </div>
      <div class="toolbar">
        <button class="ghost-btn" id="clearPicks" type="button">
          <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5"/><path d="M14 11v5"/></svg>
          清空
        </button>
        <button class="primary-btn" id="randomPick" type="button">
          <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
          随机推荐
        </button>
      </div>
    </header>

    <section class="hero" aria-label="今日推荐和已选菜单">
      <article class="today-panel">
        <img id="featuredImage" src="assets/tomato-beef.jpg" alt="今日推荐菜品" />
        <div class="today-copy">
          <h2 id="featuredName">番茄牛腩</h2>
          <p id="featuredDesc">软烂牛腩、酸甜番茄和米饭很搭，适合工作日中午吃得认真一点。</p>
        </div>
      </article>

      <aside class="pick-panel" aria-label="今天想吃">
        <div class="panel-title">
          <h2>今天想吃</h2>
          <span class="date-chip" id="todayText"></span>
        </div>
        <div class="selected-list" id="selectedList"></div>
        <div class="note-box">
          <label for="lunchNote">口味备注</label>
          <input id="lunchNote" type="text" placeholder="例如：少辣、多放葱、不要香菜" />
          <div class="pick-actions">
            <button class="primary-btn" id="saveMenu" type="button">
              <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
              保存今天菜单
            </button>
          </div>
        </div>
        <div class="history-box">
          <div class="history-title">
            <h3>已吃菜单</h3>
            <button class="ghost-btn" id="clearHistory" type="button">清空记录</button>
          </div>
          <div class="history-list" id="historyList"></div>
        </div>
      </aside>
    </section>

    const cardObserver = new IntersectionObserver(entries => {
      for (const en of entries) {
        if (en.isIntersecting) visibleCards.add(en.target.dataset.dish);
        else visibleCards.delete(en.target.dataset.dish);
      }
    }, { threshold: 0.3 });

    function observeCards() {
      document.querySelectorAll(".dish-carousel").forEach(el => cardObserver.observe(el));
    }

    function advanceCard(id, delta, setIdx) {
      const dish = dishes.find(item => item.id === id);
      if (!dish) return;
      const imgs = (dish.images && dish.images.length ? dish.images : [dish.image]).filter(Boolean);
      if (imgs.length < 2) return;
      const wrap = document.querySelector(`.dish-carousel[data-dish="${id}"]`);
      if (!wrap) return;
      const next = setIdx === undefined ? ((cardIndex.get(id) || 0) + delta + imgs.length) % imgs.length : setIdx;
      cardIndex.set(id, next);
      const img = wrap.querySelector("img");
      if (img) img.src = imgs[next];
      wrap.querySelectorAll(".car-dot").forEach((d, k) => d.classList.toggle("on", k === next));
    }

    setInterval(() => {
      for (const id of visibleCards) {
        if (!hoverCards.has(id)) advanceCard(id, 1);
      }
    }, 4500);

    function savePicks() {
      localStorage.setItem("lunch-picks", JSON.stringify([...selected]));
    }

    function getHistory() {
      return JSON.parse(localStorage.getItem("lunch-history") || "[]");
    }

    function saveHistory(history) {
      localStorage.setItem("lunch-history", JSON.stringify(history));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

      return categoryOk && searchOk;
    }

          ${showLabel ? `
          <text x="450" y="575" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="44" font-weight="700" fill="#24221f">${name}</text>
          <text x="450" y="625" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#6d6861">${category}</text>` : ""}
        </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function imageMarkup(dish, extra = "") {
      const fallback = fallbackImage(dish.name, dish.category);
      const onerror = dish.image ? ` onerror="this.onerror=null;this.src='${fallback}'"` : "";
      return `<img src="${dish.image || fallback}" alt="${dish.name}" ${extra}${onerror} />`;
    }

    function renderChips() {
      chips.innerHTML = categories.map(category => `
        <button class="chip ${category === activeCategory ? "active" : ""}" type="button" data-category="${category}">
          ${category}
        </button>
      `).join("");
    }

    function renderGrid() {
      const visible = dishes.filter(dishMatches);
      const groups = categories
        .filter(category => category !== "全部")
        .map(category => ({
          category,
          items: visible.filter(dish => dish.category === category)
        }))
        .filter(group => group.items.length);

      grid.innerHTML = groups.map(group => `
        <section class="category-section" aria-label="${group.category}">
          <div class="category-head">
            <div>
              <h3>${group.category}</h3>
              <p>${categoryNotes[group.category] || "按口味和做法归类，方便快速决定今天吃什么。"}</p>
            </div>
            <span class="category-count">${group.items.length} 道</span>
          </div>
          <div class="grid">
            ${group.items.map(dish => {
              const badges = dish.url
                ? [`<span class="badge">${dish.category}</span>`, dish.likes ? `<span class="badge">❤ ${dish.likes}</span>` : "", dish.ntype ? `<span class="badge">${dish.ntype}</span>` : ""].filter(Boolean).join("")
                : `<span class="badge">${dish.category}</span><span class="badge">${dish.time}</span><span class="badge">${dish.heat}</span>`;
              const cardDesc = dish.desc || "";
              const heatBadge = dish.heat ? `<span class="heat">${dish.heat}</span>` : "";
              const metaTags = (dish.tags || []).slice(0, 3).map(tag => `<span>${tag}</span>`).join("");
              const recipeButton = `<button type="button" data-recipe="${dish.id}">看菜谱</button>`;
              const imgs = (dish.images && dish.images.length ? dish.images : [dish.image]).filter(Boolean);
              const idx = cardIndex.get(dish.id) || 0;
              const carousel = `
            <div class="dish-carousel" data-dish="${dish.id}">
              <img src="${imgs[idx]}" alt="${dish.name}" loading="lazy">
              ${imgs.length > 1 ? `
              <button type="button" class="car-nav prev" data-nav="-1" aria-label="上一张">‹</button>
              <button type="button" class="car-nav next" data-nav="1" aria-label="下一张">›</button>
              <div class="car-dots">${imgs.map((_, k) => `<span class="car-dot ${k === idx ? "on" : ""}" data-dot="${k}"></span>`).join("")}</div>
              ` : ""}
            </div>`;
              return `
        <article class="dish-card">
          <div class="dish-image">
            ${carousel}
            <div class="badge-row">${badges}</div>
          </div>
          <div class="dish-body">
            <div class="dish-title">
              <h3>${dish.name}</h3>
              ${heatBadge}
            </div>
            <p>${cardDesc}</p>
            <div class="meta">${metaTags}</div>
            <div class="card-actions">
              ${recipeButton}
              <button type="button" class="pick" data-pick="${dish.id}">${selected.has(dish.id) ? "已加入" : "加入午餐"}</button>
            </div>
          </div>
        </article>`;
            }).join("")}
          </div>
        </section>
      `).join("") || `<div class="empty-state">没有找到匹配的菜，换个关键词试试。</div>`;
      observeCards();
    }

    function renderSelected() {
      const picked = dishes.filter(dish => selected.has(dish.id));
      selectedList.innerHTML = picked.length ? picked.map(dish => `
        <div class="selected-item">
          ${imageMarkup(dish)}
          <div>
            <strong>${dish.name}</strong>
            <span>${[dish.category, dish.time, dish.heat, dish.source ? "@" + dish.source : "", dish.likes ? "❤ " + dish.likes : ""].filter(Boolean).join(" · ")}</span>
          </div>
          <button class="remove-btn" type="button" aria-label="移除 ${dish.name}" data-remove="${dish.id}">×</button>
        </div>
      `).join("") : `<div class="empty-state">还没有选择。她点喜欢的菜后，这里会变成今天的午饭候选清单。</div>`;
    }

    function getTodayMenuName() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}年${month}月${day}日菜单`;
    }

    function saveTodayMenu() {
      const picked = dishes.filter(dish => selected.has(dish.id));
      if (!picked.length) {
        showToast("先加入至少一道菜，再保存菜单");
        return;
      }

      const name = getTodayMenuName();
      const entry = {
        id: name,
        name,
        savedAt: new Date().toISOString(),
        note: noteInput.value.trim(),
        dishes: picked.map(dish => ({
          id: dish.id,
          name: dish.name,
          category: dish.category,
          heat: dish.heat || ""
        }))
      };
      const history = getHistory();
      const existingIndex = history.findIndex(item => item.id === entry.id);
      if (existingIndex >= 0) {
        history[existingIndex] = entry;
      } else {
        history.unshift(entry);
      }
      saveHistory(history);
      renderHistory();
      showToast(`${name} 已保存`);
    }

    function renderHistory() {
      const history = getHistory();
      historyList.innerHTML = history.length ? history.map(entry => `
        <details class="history-item">
          <summary>${escapeHtml(entry.name)}</summary>
          <ul>
            ${entry.dishes.map(dish => `<li>${escapeHtml([dish.name, dish.category, dish.heat].filter(Boolean).join(" · "))}</li>`).join("")}
          </ul>
          ${entry.note ? `<p class="history-note">备注：${escapeHtml(entry.note)}</p>` : ""}
        </details>
      `).join("") : `<div class="empty-state">还没有保存过菜单。保存后会按日期留在这里，方便回看吃过什么。</div>`;
    }

    function setFeatured(dish) {
      const featuredImage = document.querySelector("#featuredImage");
      featuredImage.onerror = dish.image ? () => {
        featuredImage.onerror = null;
        featuredImage.src = fallbackImage(dish.name, dish.category, false);
      } : null;
      featuredImage.src = dish.image || fallbackImage(dish.name, dish.category, false);
      featuredImage.alt = dish.name;
      document.querySelector("#featuredName").textContent = dish.name;
      document.querySelector("#featuredDesc").textContent = dish.desc;
    }

    let modalImgs = [], modalIdx = 0, modalAuto = null, modalDish = null;
    function showModalImg(i) {
      if (!modalImgs.length) return;
      modalIdx = (i + modalImgs.length) % modalImgs.length;
      const mainImg = document.querySelector("#modalImage");
      mainImg.onerror = modalImgs[modalIdx].indexOf("assets/") === 0 && modalDish ? () => {
        mainImg.onerror = null;
        mainImg.src = fallbackImage(modalDish.name, modalDish.category);
      } : null;
      mainImg.src = modalImgs[modalIdx];
      mainImg.alt = (modalDish ? modalDish.name : "") + " 图" + (modalIdx + 1);
      document.querySelectorAll("#modalThumbs img").forEach((t, k) => t.classList.toggle("active", k === modalIdx));
    }
    function stopModalAuto() {
      if (modalAuto) { clearInterval(modalAuto); modalAuto = null; }
    }
    function startModalAuto() {
      stopModalAuto();
      if (modalImgs.length < 2) return;
      modalAuto = setInterval(() => {
        if (!modal.classList.contains("open")) { stopModalAuto(); return; }
        showModalImg(modalIdx + 1);
      }, 3500);
    }
    function modalManual(delta) {
      showModalImg(modalIdx + delta);
      startModalAuto();
    }
    function openRecipe(id) {
      const dish = dishes.find(item => item.id === id);
      if (!dish) return;
      modalDish = dish;
      modalImgs = (dish.images && dish.images.length ? dish.images : [dish.image]).filter(Boolean);
      const thumbs = document.querySelector("#modalThumbs");
      thumbs.innerHTML = modalImgs.length > 1
        ? modalImgs.map((src, i) => `<img src="${src}" data-idx="${i}" class="${i === 0 ? "active" : ""}" alt="图${i + 1}">`).join("")
        : "";
      showModalImg(0);
      startModalAuto();
      const navDisplay = modalImgs.length > 1 ? "" : "none";
      document.querySelector("#modalPrev").style.display = navDisplay;
      document.querySelector("#modalNext").style.display = navDisplay;
      document.querySelector("#modalTitle").textContent = dish.name;
      document.querySelector("#modalDesc").textContent = dish.desc || "";
      const metaParts = dish.url
        ? [dish.category, "@" + dish.source, "❤ " + dish.likes, dish.ntype]
        : [dish.category, dish.time, dish.difficulty, dish.heat];
      document.querySelector("#modalMeta").innerHTML = metaParts.map(item => `<span>${item}</span>`).join("");
      const ing = dish.ingredients || [];
      const stp = dish.steps || [];
      const ingHead = document.querySelector("#modalIngHead");
      const ingList = document.querySelector("#modalIngredients");
      ingHead.style.display = ing.length ? "" : "none";
      ingList.style.display = ing.length ? "" : "none";
      ingList.innerHTML = ing.map(item => `<li>${item}</li>`).join("");
      const stpHead = document.querySelector("#modalStepsHead");
      const stpList = document.querySelector("#modalSteps");
      stpHead.style.display = stp.length ? "" : "none";
      stpList.style.display = stp.length ? "" : "none";
      stpList.innerHTML = stp.map(item => `<li>${item}</li>`).join("");
      document.querySelector("#modalLink").innerHTML = dish.url
        ? `<a class="source-link" href="${dish.url}" target="_blank" rel="noopener">打开小红书原笔记 ↗</a>`
        : "";
      modal.classList.add("open");
    }

    function addPick(id) {
      const dish = dishes.find(item => item.id === id);
      if (!dish) return;
      selected.add(id);
      savePicks();
      renderSelected();
      renderGrid();
      setFeatured(dish);
      showToast(`${dish.name} 已加入今天午餐`);
    }

    function removePick(id) {
      selected.delete(id);
      savePicks();
      renderSelected();
      renderGrid();
    }

    function initDate() {
      const formatter = new Intl.DateTimeFormat("zh-CN", { month: "long", day: "numeric", weekday: "long" });
      document.querySelector("#todayText").textContent = formatter.format(new Date());
    }

    chips.addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      activeCategory = button.dataset.category;
      renderChips();
      renderGrid();
    });

    grid.addEventListener("click", event => {
      const nav = event.target.closest("[data-nav]");
      const dot = event.target.closest("[data-dot]");
      const recipe = event.target.closest("[data-recipe]");
      const pick = event.target.closest("[data-pick]");
      if (nav) {
        advanceCard(nav.closest(".dish-carousel").dataset.dish, Number(nav.dataset.nav));
        return;
      }
      if (dot) {
        advanceCard(dot.closest(".dish-carousel").dataset.dish, 0, Number(dot.dataset.dot));
        return;
      }
      if (recipe) openRecipe(recipe.dataset.recipe);
      if (pick) addPick(pick.dataset.pick);
    });

    grid.addEventListener("mouseover", event => {
      const wrap = event.target.closest(".dish-carousel");
      if (wrap && !(event.relatedTarget && wrap.contains(event.relatedTarget))) hoverCards.add(wrap.dataset.dish);
    });

    grid.addEventListener("mouseout", event => {
      const wrap = event.target.closest(".dish-carousel");
      if (wrap && !(event.relatedTarget && wrap.contains(event.relatedTarget))) hoverCards.delete(wrap.dataset.dish);
    });

    selectedList.addEventListener("click", event => {
      const remove = event.target.closest("[data-remove]");
      if (remove) removePick(remove.dataset.remove);
    });

    document.querySelector("#searchInput").addEventListener("input", event => {
      query = event.target.value.trim();
      renderGrid();
    });

    document.querySelector("#randomPick").addEventListener("click", () => {
      const pool = dishes.filter(dishMatches);
      const dish = pool[Math.floor(Math.random() * pool.length)] || dishes[0];
      addPick(dish.id);
    });

    document.querySelector("#clearPicks").addEventListener("click", () => {
      selected.clear();
      savePicks();
      renderSelected();
      renderGrid();
      showToast("今天的候选清单已清空");
    });

    document.querySelector("#saveMenu").addEventListener("click", saveTodayMenu);

    document.querySelector("#clearHistory").addEventListener("click", () => {
      saveHistory([]);
      renderHistory();
      showToast("已吃菜单记录已清空");
    });

    document.querySelector("#showAll").addEventListener("click", () => {
      activeCategory = "全部";
      query = "";
      document.querySelector("#searchInput").value = "";
      renderChips();
      renderGrid();
    });

    document.querySelector("#closeModal").addEventListener("click", () => { modal.classList.remove("open"); stopModalAuto(); });
    modal.addEventListener("click", event => {
      if (event.target === modal) { modal.classList.remove("open"); stopModalAuto(); }
    });
    window.addEventListener("keydown", event => {
      if (event.key === "Escape") { modal.classList.remove("open"); stopModalAuto(); }
      if (event.key === "ArrowLeft" && modal.classList.contains("open")) modalManual(-1);
      if (event.key === "ArrowRight" && modal.classList.contains("open")) modalManual(1);
    });
    document.querySelector("#modalPrev").addEventListener("click", () => modalManual(-1));
    document.querySelector("#modalNext").addEventListener("click", () => modalManual(1));
    document.querySelector("#modalThumbs").addEventListener("click", event => {
      const im = event.target.closest("img[data-idx]");
      if (!im) return;
      showModalImg(Number(im.dataset.idx));
      startModalAuto();
    });

    noteInput.value = localStorage.getItem("lunch-note") || "";
    noteInput.addEventListener("input", () => localStorage.setItem("lunch-note", noteInput.value));

    initDate();
    renderChips();
    renderSelected();
    renderHistory();
    renderGrid();
  </script>
</body>
</html>
